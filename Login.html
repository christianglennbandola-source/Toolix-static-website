<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Template</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <header>
        <nav class="navbar section-content">
            <a href="#" class="nav-logo">
                <h2 class="logo-text">Toolix</h2>
            </a>
            
            <ul class="nav-menu">
                <button id="menu-close-button" class="material-symbols-outlined">close</button>
                
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link">About</a>
                </li>
                <li class="nav-item">
                    <a href="menu.html" class="nav-link">Items</a>
                </li>
                <li class="nav-item">
                    <a href="Login.html" class="nav-link">Log-in</a>
                </li>
                <li class="nav-item">
                    <a href="inquiry.html" class="nav-link">Inquiries</a>
                </li>
            </ul>

            <button id="menu-open-button" class="material-symbols-outlined">menu</button>
        </nav>
        
        <main class="main-content">
            <div class="container-box">
                <div class="login-box">
                    <div class="form-tabs">
                        <button id="login-tab" class="tab-btn active">Log In</button>
                        <button id="signup-tab" class="tab-btn">Sign Up</button>
                    </div>

                    <form id="login-form" class="auth-form active" action="index.html">
                        <div class="description">
                            <h3>Welcome Back</h3>
                            <p>Please enter your credentials to log in.</p>
                        </div>

                        <div class="logbar">
                            <div class="grouper">
                                <div class="email">
                                    <label for="login-email">Email</label>
                                    <input type="email" id="login-email" class="log" placeholder="Enter your email" required />
                                </div>
                                <div class="password">
                                    <label for="login-password">Password</label>
                                    <input type="password" id="login-password" class="log" placeholder="Enter your password" required />
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn">Log In</button>
                    </form>

                    <form id="signup-form" class="auth-form" action="index.html">
                        <div class="description">
                            <h3>Create Account</h3>
                            <p>Join us by creating a new account.</p>
                        </div>

                        <div class="logbar">
                            <div class="grouper">
                                <div class="email">
                                    <label for="signup-email">Email</label>
                                    <input type="email" id="signup-email" class="log" placeholder="Enter your email" required />
                                </div>
                                <div class="password">
                                    <label for="signup-password">Password</label>
                                    <input type="password" id="signup-password" class="log" placeholder="Create password" required />
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn">Sign Up</button>
                    </form>
                </div>
            </div>
        </main>
    </header>

    <script src="script3.js"></script>
</body>
</html>
